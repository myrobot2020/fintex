displayName: "Gold Forecast - Data Freshness / API Errors"
documentation:
  content: |
    Alerts when gold price data may be stale or the forecast API is erroring.
  mimeType: text/markdown
conditions:
- displayName: "Cloud Run 5xx rate high"
  conditionThreshold:
    filter: >
      resource.type = "cloud_run_revision"
      AND resource.labels.service_name = "gold-forecast-api"
      AND metric.type = "run.googleapis.com/request_count"
      AND metric.labels.response_code_class = "5xx"
    comparison: COMPARISON_GT
    thresholdValue: 5
    duration: 300s
    aggregations:
    - alignmentPeriod: 60s
      perSeriesAligner: ALIGN_RATE
  combiners: OR
  enabled: true
notificationChannels: []
